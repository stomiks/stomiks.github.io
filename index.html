<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Svetlana Goes to Trieste</title>
    <style>
        body {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            text-align: center;
            color: #333;
        }
        header {
            background: #2c3e50;
            color: white;
            padding: 20px;
            font-size: 24px;
        }
        .container {
            width: 90%;
            max-width: 800px;
            margin: auto;
            padding: 20px;
        }
        .section {
            margin: 40px 0;
            padding: 20px;
            background: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 10px;
        }
        h2 {
            color: #2980b9;
        }
        .slideshow-container {
            position: relative;
            max-width: 100%;
            margin: auto;
        }
        .slide {
            display: none;
            width: 100%;
            border-radius: 8px;
        }
        .fade {
            animation: fadeEffect 1.5s ease-in-out;
        }
        @keyframes fadeEffect {
            from {opacity: 0.4}
            to {opacity: 1}
        }
    </style>
</head>
<body>

<header>Svetlana Goes to Trieste</header>

<div class="container">
    <div class="section">
        <h2>Beautiful Sights</h2>
        <div class="slideshow-container" id="sights">
            <img class="slide fade" src="https://upload.wikimedia.org/wikipedia/commons/6/6c/Trieste_Piazza_Unita_d%27Italia.jpg">
            <img class="slide fade" src="https://upload.wikimedia.org/wikipedia/commons/a/a1/Castello_di_Miramare%2C_Trieste%2C_Italia.jpg">
            <img class="slide fade" src="https://upload.wikimedia.org/wikipedia/commons/8/8e/Trieste_-_Canal_Grande_-_panoramio.jpg">
            <img class="slide fade" src="https://upload.wikimedia.org/wikipedia/commons/b/b7/Trieste_Cattedrale_di_San_Giusto.jpg">
            <img class="slide fade" src="https://upload.wikimedia.org/wikipedia/commons/3/3c/Trieste_-_Vista_dal_molo_Audace.jpg">
        </div>
    </div>

    <div class="section">
        <h2>Museums to Visit</h2>
        <div class="slideshow-container" id="museums">
            <img class="slide fade" src="https://upload.wikimedia.org/wikipedia/commons/f/f3/Revoltella_Museum%2C_Trieste.jpg">
            <img class="slide fade" src="https://upload.wikimedia.org/wikipedia/commons/d/d1/Trieste%2C_Italy_-_Natural_History_Museum.jpg">
            <img class="slide fade" src="https://upload.wikimedia.org/wikipedia/commons/a/a2/Civic_Museum_of_Marine_Biology_Trieste.jpg">
            <img class="slide fade" src="https://upload.wikimedia.org/wikipedia/commons/0/0e/Trieste_War_Museum.jpg">
            <img class="slide fade" src="https://upload.wikimedia.org/wikipedia/commons/7/71/Postal_Museum_Trieste.jpg">
        </div>
    </div>

    <div class="section">
        <h2>Trieste Weather</h2>
        <div class="slideshow-container" id="weather">
            <img class="slide fade" src="https://upload.wikimedia.org/wikipedia/commons/3/32/Trieste_Sunny.jpg">
            <img class="slide fade" src="https://upload.wikimedia.org/wikipedia/commons/e/e9/Trieste_Rainy_Day.jpg">
            <img class="slide fade" src="https://upload.wikimedia.org/wikipedia/commons/8/85/Trieste_Windy_Bora.jpg">
            <img class="slide fade" src="https://upload.wikimedia.org/wikipedia/commons/6/69/Trieste_Foggy_View.jpg">
            <img class="slide fade" src="https://upload.wikimedia.org/wikipedia/commons/5/57/Trieste_Snowy_Winter.jpg">
        </div>
    </div>
</div>

<script>
    function startSlideshow(slideshowId) {
        let slides = document.getElementById(slideshowId).getElementsByClassName("slide");
        let index = 0;
        function showSlide() {
            for (let i = 0; i < slides.length; i++) {
                slides[i].style.display = "none";
            }
            slides[index].style.display = "block";
            index = (index + 1) % slides.length;
            setTimeout(showSlide, 3000);
        }
        showSlide();
    }
    window.onload = function() {
        startSlideshow("sights");
        startSlideshow("museums");
        startSlideshow("weather");
    };
</script>

</body>
</html>
